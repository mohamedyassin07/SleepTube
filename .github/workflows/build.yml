name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded to $RUNNER_TEMP/release.jks"
          else
            echo "No KEYSTORE_B64 secret; release will use debug signing"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          cp "$APK" SleepTube.apk
          printf '{"versionCode": %s, "versionName": "1.0.%s", "sha": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.sha }}" > version.json
          cat version.json
          ls -l SleepTube.apk
          if [ -n "$KEYSTORE_FILE" ]; then
            "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -n1)/apksigner verify --print-certs SleepTube.apk | head -n 5 || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SleepTube-apk
          path: |
            SleepTube.apk
            version.json

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SleepTube.apk version.json \
            --title "SleepTube (build ${{ github.run_number }})" \
            --notes "versionCode: ${{ github.run_number }}
          Automatic build from ${{ github.sha }}" \
            --target "${{ github.sha }}"
